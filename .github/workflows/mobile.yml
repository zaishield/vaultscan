name: mobile

# Builds the Expo app for iOS + Android via EAS Build.
#
# - typecheck + lint runs on every push (cheap, signal-only).
# - Production builds run only on tag push (refs/tags/v*) since
#   EAS Build burns paid minutes.
#
# Required secrets:
#   EXPO_TOKEN              — `eas login` token from a CI service account
#   EXPO_APPLE_ID           — App Store Connect identity (submit only)
#   EXPO_ASC_APP_ID         — App Store Connect app ID (submit only)
#   EXPO_APPLE_TEAM_ID
#
# Configure in the repo's Settings → Secrets and variables → Actions.

on:
  push:
    branches: [main, "claude/**"]
    tags:     ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: install
        working-directory: mobile
        run: npm ci || npm install
      - name: typecheck
        working-directory: mobile
        run: npm run typecheck

  build:
    name: eas build (production, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: startsWith(github.ref, 'refs/tags/v')
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: install eas-cli
        run: npm install -g eas-cli@latest
      - name: install
        working-directory: mobile
        run: npm ci || npm install
      - name: eas build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --non-interactive --platform ${{ matrix.platform }} \
            --profile production --no-wait --json > build.json
          cat build.json
      - uses: actions/upload-artifact@v4
        with:
          name: eas-build-${{ matrix.platform }}-${{ github.ref_name }}
          path: mobile/build.json
          retention-days: 90
