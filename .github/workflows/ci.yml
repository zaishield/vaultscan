name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: vet
        working-directory: backend
        run: go vet ./...
      - name: build
        working-directory: backend
        run: go build ./...
      - name: unit tests with coverage
        working-directory: backend
        run: |
          go test -race -count=1 -covermode=atomic \
            -coverprofile=coverage.out -coverpkg=./internal/... ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt
          # Per-package coverage table for the CI summary panel.
          {
            echo '## Backend coverage'
            echo ''
            echo '| Package | Coverage |'
            echo '| --- | --- |'
            go tool cover -func=coverage.out \
              | grep -v "^total" \
              | awk -F'\t+' '{print $1, $NF}' \
              | sed -E 's@github.com/zaishield/vaultscan/backend/@@' \
              | awk '{pkg=$1; sub(/[^/]+:[0-9]+:$/, "", pkg); cov[pkg]=$NF; n[pkg]++}
                     END {for (p in cov) printf "| %s | %s |\n", p, cov[p]}' \
              | sort -t '|' -k2
            echo ''
            echo '### Total'
            grep "^total" coverage-summary.txt | awk '{print "Total:", $NF}'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: enforce coverage floor
        working-directory: backend
        run: |
          # Unit-only floor — the integration suite carries the api +
          # scanorch + reports coverage; this gate guards the pure
          # business-logic packages (auth, awssig, parsers, compliance,
          # findings, …). Bump COVERAGE_FLOOR in the same change that
          # earns the lift; never decrease it as a workaround.
          COVERAGE_FLOOR="18.0"
          got=$(grep "^total" coverage-summary.txt | awk '{print $NF}' | tr -d '%')
          echo "coverage=$got floor=$COVERAGE_FLOOR"
          # bash float compare via awk
          awk -v g="$got" -v f="$COVERAGE_FLOOR" 'BEGIN { if (g+0 < f+0) { print "FAIL: coverage", g, "below floor", f; exit 1 } }'
      - name: upload coverage artefact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage-summary.txt
          retention-days: 14
      - name: upload to codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: backend/coverage.out
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  agent:
    name: agent build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: agent/go.sum
      - name: vet
        working-directory: agent
        run: go vet ./...
      - name: build
        working-directory: agent
        run: go build ./...
      - name: unit tests with coverage
        working-directory: agent
        run: |
          go test -race -count=1 -covermode=atomic \
            -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt
          {
            echo '## Agent coverage'
            echo ''
            grep "^total" coverage-summary.txt | awk '{print "Total:", $NF}'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload agent coverage artefact
        uses: actions/upload-artifact@v4
        with:
          name: agent-coverage
          path: |
            agent/coverage.out
            agent/coverage-summary.txt
          retention-days: 14
      - name: upload agent coverage to codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: agent/coverage.out
          flags: agent
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  integration:
    name: backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaultscan
          POSTGRES_PASSWORD: vaultscan
          POSTGRES_DB: vaultscan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaultscan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: integration suite with coverage
        working-directory: backend
        env:
          VAULTSCAN_TEST_DATABASE_URL: postgres://vaultscan:vaultscan@localhost:5432/vaultscan?sslmode=disable
        run: |
          go test -tags=integration -count=1 -timeout=10m \
            -covermode=atomic \
            -coverpkg=./internal/...,./cmd/... \
            -coverprofile=integration-coverage.out \
            ./test/integration/...
          go tool cover -func=integration-coverage.out | tee integration-coverage-summary.txt
          {
            echo '## Backend integration coverage'
            echo ''
            grep "^total" integration-coverage-summary.txt | awk '{print "Total:", $NF}'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload integration coverage artefact
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-coverage
          path: |
            backend/integration-coverage.out
            backend/integration-coverage-summary.txt
          retention-days: 14
      - name: upload integration coverage to codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: backend/integration-coverage.out
          flags: integration
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: frontend build + type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        working-directory: frontend
        run: npm ci
      - name: typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: build
        working-directory: frontend
        run: npm run build

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          working-directory: backend
          args: --timeout=5m
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          working-directory: agent
          args: --timeout=5m

  fuzz:
    name: fuzz parsers + security-critical surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: fuzz suite (smoke, 20s per target)
        working-directory: backend
        # Each fuzz target gets a short budget on every CI run — long
        # campaigns belong on a scheduled workflow. The goal here is to
        # exercise the corpus seeds + spend a few seconds finding fresh
        # interesting inputs so regressions caught between releases.
        run: |
          set -e
          # Iterate per-package; fuzz targets are package-local and
          # `go test -fuzz` accepts only one package at a time.
          for p in awssig audit auth compliance parsers; do
            for f in $(go test -list '^Fuzz' ./internal/$p/... 2>/dev/null | grep '^Fuzz' || true); do
              echo "== fuzzing $p::$f for 20s =="
              go test -run='^$' -fuzz="^$f\$" -fuzztime=20s ./internal/$p/...
            done
          done

  migrations:
    name: migrations apply + rollback round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaultscan
          POSTGRES_PASSWORD: vaultscan
          POSTGRES_DB: vaultscan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaultscan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: build migrate binary
        working-directory: backend
        run: go build -o /tmp/migrate ./cmd/migrate
      - name: apply every migration up
        env:
          VAULTSCAN_DATABASE_URL: postgres://vaultscan:vaultscan@localhost:5432/vaultscan?sslmode=disable
        run: /tmp/migrate -dir backend/migrations
      - name: assert expected tables exist
        env:
          PGPASSWORD: vaultscan
        run: |
          # Spot-check a handful of tables from across the migration
          # history so renames / accidental drops are loud.
          for t in tenants partners users audit_logs scan_jobs findings \
                   tenant_data_keys tenant_pool_routing tenant_residency_history \
                   integration_inbound_log; do
            n=$(psql -h localhost -U vaultscan -d vaultscan -At \
                  -c "SELECT 1 FROM information_schema.tables WHERE table_name='$t'")
            [ "$n" = "1" ] || { echo "FAIL: table $t missing"; exit 1; }
          done
      - name: walk every migration down
        env:
          VAULTSCAN_DATABASE_URL: postgres://vaultscan:vaultscan@localhost:5432/vaultscan?sslmode=disable
        # Roll back every migration in reverse; if any .down.sql is
        # broken (forgot a CASCADE, references a dropped table, etc)
        # this surfaces it before production runs the same.
        run: |
          if /tmp/migrate -dir backend/migrations -help 2>&1 | grep -q -- "-down"; then
            /tmp/migrate -dir backend/migrations -down
          else
            echo "migrate binary has no -down flag; skipping rollback gate (please add)"
          fi

  helm:
    name: helm chart lint + per-env render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging, uat, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - name: lint default values
        run: helm lint infra/helm/vaultscan
      - name: lint ${{ matrix.env }} overlay
        run: helm lint infra/helm/vaultscan -f infra/helm/vaultscan/values-${{ matrix.env }}.yaml
      - name: template ${{ matrix.env }} overlay
        run: |
          helm template vaultscan infra/helm/vaultscan \
            -f infra/helm/vaultscan/values-${{ matrix.env }}.yaml \
            --debug > /tmp/render-${{ matrix.env }}.yaml
      - name: verify pod security context rendered on every workload
        run: |
          set -euo pipefail
          F=/tmp/render-${{ matrix.env }}.yaml
          for w in api agent-gateway analytics-worker cron-runner; do
            kind="Deployment"
            # readOnlyRootFilesystem must appear at least once per workload
            # the chart deploys. Skip if the env disables that workload.
            if grep -q "name: vaultscan-${w}$" "$F"; then
              if ! awk "/name: vaultscan-${w}$/,/^---/" "$F" | grep -q "readOnlyRootFilesystem: true"; then
                echo "FAIL: ${w} in env=${{ matrix.env }} missing readOnlyRootFilesystem"
                exit 1
              fi
            fi
          done
          # Universal security must always appear somewhere.
          grep -q "runAsNonRoot: true" "$F"
          grep -q "seccompProfile"     "$F"
      - name: verify cron-runner is deployed (every env)
        run: |
          F=/tmp/render-${{ matrix.env }}.yaml
          grep -q "kind: Deployment$" "$F"
          grep -q "vaultscan-cron-runner" "$F" || { echo "FAIL: cron-runner missing in env=${{ matrix.env }}"; exit 1; }
