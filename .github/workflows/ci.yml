name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - name: vet
        working-directory: backend
        run: go vet ./...
      - name: build
        working-directory: backend
        run: go build ./...
      - name: unit tests
        working-directory: backend
        run: go test -race -count=1 ./...

  agent:
    name: agent build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: agent/go.sum
      - name: vet
        working-directory: agent
        run: go vet ./...
      - name: build
        working-directory: agent
        run: go build ./...
      - name: unit tests
        working-directory: agent
        run: go test -race -count=1 ./...

  integration:
    name: backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaultscan
          POSTGRES_PASSWORD: vaultscan
          POSTGRES_DB: vaultscan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaultscan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - name: integration suite
        working-directory: backend
        env:
          VAULTSCAN_TEST_DATABASE_URL: postgres://vaultscan:vaultscan@localhost:5432/vaultscan?sslmode=disable
        run: go test -tags=integration -count=1 -timeout=10m ./test/integration/...

  frontend:
    name: frontend build + type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        working-directory: frontend
        run: npm ci
      - name: typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: build
        working-directory: frontend
        run: npm run build

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          working-directory: backend
          args: --timeout=5m
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          working-directory: agent
          args: --timeout=5m

  helm:
    name: helm chart lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - run: helm lint infra/helm/vaultscan
      - run: helm template infra/helm/vaultscan --debug > /tmp/render.yaml
      - name: verify pod security context rendered
        run: |
          grep -q "readOnlyRootFilesystem: true" /tmp/render.yaml
          grep -q "runAsNonRoot: true"           /tmp/render.yaml
          grep -q "seccompProfile"               /tmp/render.yaml
