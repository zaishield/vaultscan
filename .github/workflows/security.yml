name: security

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  schedule:
    # Nightly so a newly-disclosed vuln in a transitive dep raises an
    # alert without needing a code change to trigger CI.
    - cron: "37 4 * * *"

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck (backend + agent)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: scan backend
        working-directory: backend
        run: govulncheck ./...
      - name: scan agent
        working-directory: agent
        run: govulncheck ./...

  gosec:
    name: gosec (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: securego/gosec@master
        with:
          # SARIF output goes to the GitHub Security tab via upload-sarif below.
          args: "-no-fail -fmt sarif -out gosec.sarif ./backend/... ./agent/..."
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: gosec.sarif }

  trivy-images:
    name: trivy on scanner images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The 20 tools that scanner_image_registry seeds. Each Dockerfile
        # is built then scanned for CVEs (CRITICAL + HIGH only).
        tool:
          - nmap
          - nuclei
          - zap
          - openvas
          - testssl
          - sslyze
          - trivy
          - bloodhound
          - prowler
          - lynis
          - mobsf
          - netexec
          - kube-bench
          - amass
          - subfinder
          - dnsx
          - httpx
          - naabu
          - katana
          - ffuf
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t vaultscan/${{ matrix.tool }}:ci tools/scanner-images/${{ matrix.tool }}
      - name: trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: vaultscan/${{ matrix.tool }}:ci
          format: sarif
          output: trivy-${{ matrix.tool }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.tool }}.sarif
          category: trivy-${{ matrix.tool }}

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --config p/golang --config p/security-audit --config p/secrets --sarif --output semgrep.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: semgrep.sarif }

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
