name: security

on:
  push:
    branches: [main, "claude/**"]
    # v* tag pushes trigger the scanner-image-sign-and-pin job
    # which is gated internally by `if: startsWith(github.ref,
    # 'refs/tags/v')`. Without this `tags:` line that job would
    # never run on a release tag — populating digests.json would
    # be impossible from this workflow.
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    # Nightly so a newly-disclosed vuln in a transitive dep raises an
    # alert without needing a code change to trigger CI.
    - cron: "37 4 * * *"

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck (backend + agent)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: scan backend
        working-directory: backend
        run: govulncheck ./...
      - name: scan agent
        working-directory: agent
        run: govulncheck ./...

  gosec:
    name: gosec (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: securego/gosec@master
        with:
          # SARIF output goes to the GitHub Security tab via upload-sarif below.
          args: "-no-fail -fmt sarif -out gosec.sarif ./backend/... ./agent/..."
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: gosec.sarif }

  trivy-images:
    name: trivy on scanner images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The 20 tools that scanner_image_registry seeds. Each Dockerfile
        # is built then scanned for CVEs (CRITICAL + HIGH only).
        tool:
          - nmap
          - nuclei
          - zap
          - openvas
          - testssl
          - sslyze
          - trivy
          - bloodhound
          - prowler
          - lynis
          - mobsf
          - netexec
          - kube-bench
          - amass
          - subfinder
          - dnsx
          - httpx
          - naabu
          - katana
          - ffuf
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t vaultscan/${{ matrix.tool }}:ci tools/scanner-images/${{ matrix.tool }}
      - name: trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: vaultscan/${{ matrix.tool }}:ci
          format: sarif
          output: trivy-${{ matrix.tool }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.tool }}.sarif
          category: trivy-${{ matrix.tool }}

  scanner-image-sign-and-pin:
    # Builds + pushes each scanner image to the registry, signs with
    # cosign keyless, captures the immutable digest, and writes
    # tools/scanner-images/digests.json so the orchestrator can pin
    # pulls. Only runs on main branch tag pushes (`v*`).
    name: cosign sign + digest pin (scanner images)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write       # to commit digests.json back
      id-token: write       # OIDC for keyless sign
      packages: write
    needs: trivy-images
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        tool:
          - nmap
          - nuclei
          - zap
          - openvas
          - testssl
          - sslyze
          - trivy
          - bloodhound
          - prowler
          - lynis
          - mobsf
          - netexec
          - kube-bench
          - amass
          - subfinder
          - dnsx
          - httpx
          - naabu
          - katana
          - ffuf
          - gitleaks
          - gobuster
          - dirsearch
          - hydra
          - recon-ng
          - semgrep
          - sqlmap
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - name: login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + push image
        id: build
        run: |
          IMG=ghcr.io/${{ github.repository }}/scanners/${{ matrix.tool }}:${{ github.ref_name }}
          docker build -t "$IMG" tools/scanner-images/${{ matrix.tool }}
          docker push "$IMG"
          DIGEST=$(docker buildx imagetools inspect "$IMG" --format '{{ "{{ .Manifest.Digest }}" }}')
          echo "img=$IMG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: cosign sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes "${{ steps.build.outputs.img }}@${{ steps.build.outputs.digest }}"
      - name: emit digest fragment
        run: |
          mkdir -p .digests
          echo "${{ matrix.tool }}=${{ steps.build.outputs.digest }}" \
            > .digests/${{ matrix.tool }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.tool }}
          path: .digests/${{ matrix.tool }}.txt

  scanner-digests-aggregate:
    # Collects the per-tool digest fragments and writes
    # tools/scanner-images/digests.json, then commits + pushes it
    # back so the orchestrator can read the digest map at boot.
    name: aggregate digests → digests.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: scanner-image-sign-and-pin
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: .digests
          pattern: digest-*
          merge-multiple: true
      - name: build digests.json
        run: |
          python3 - <<'PY'
          import json, os, glob
          out = {"version": "${{ github.ref_name }}", "registry":
                 "ghcr.io/${{ github.repository }}/scanners", "digests": {}}
          for path in sorted(glob.glob(".digests/*.txt")):
              with open(path) as f:
                  for line in f:
                      line = line.strip()
                      if "=" in line:
                          tool, digest = line.split("=", 1)
                          out["digests"][tool] = digest
          os.makedirs("tools/scanner-images", exist_ok=True)
          with open("tools/scanner-images/digests.json", "w") as f:
              json.dump(out, f, indent=2, sort_keys=True)
              f.write("\n")
          print(f"wrote {len(out['digests'])} digests")
          PY
      - name: commit
        run: |
          git config user.name  "vaultscan-bot"
          git config user.email "bot@vaultscan.zaishield.com"
          git add tools/scanner-images/digests.json
          git diff --staged --quiet || git commit -m "chore(scanners): pin digests for ${{ github.ref_name }}"
          git push origin HEAD:main || true

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --config p/golang --config p/security-audit --config p/secrets --sarif --output semgrep.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: semgrep.sarif }

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  trivy-backend-images:
    # Builds the production backend / agent-gateway / portal /
    # analytics-worker images and scans each for CVEs.
    name: trivy on backend images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api,              dockerfile: backend/Dockerfile,                  context: backend }
          - { name: agent-gateway,    dockerfile: backend/cmd/agent-gateway/Dockerfile, context: backend }
          - { name: analytics-worker, dockerfile: backend/cmd/analytics-worker/Dockerfile, context: backend }
          - { name: portal,           dockerfile: frontend/Dockerfile,                 context: frontend }
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t vaultscan/${{ matrix.name }}:ci -f ${{ matrix.dockerfile }} ${{ matrix.context }}
      - name: trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: vaultscan/${{ matrix.name }}:ci
          format: sarif
          output: trivy-backend-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend-${{ matrix.name }}.sarif
          category: trivy-backend-${{ matrix.name }}

  sbom:
    # Software Bill of Materials per image. CycloneDX JSON format —
    # ingested by SCA tools (Dependency-Track, Snyk, Mend) and
    # required for SLSA Level 3 attestation.
    name: syft SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [api, agent-gateway, analytics-worker, portal]
    steps:
      - uses: actions/checkout@v4
      - name: install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: build image
        run: |
          case "${{ matrix.component }}" in
            api)              docker build -t vaultscan/api:sbom              -f backend/Dockerfile backend ;;
            agent-gateway)    docker build -t vaultscan/agent-gateway:sbom    -f backend/cmd/agent-gateway/Dockerfile backend ;;
            analytics-worker) docker build -t vaultscan/analytics-worker:sbom -f backend/cmd/analytics-worker/Dockerfile backend ;;
            portal)           docker build -t vaultscan/portal:sbom           -f frontend/Dockerfile frontend ;;
          esac
      - name: generate SBOM
        run: |
          syft vaultscan/${{ matrix.component }}:sbom -o cyclonedx-json > sbom-${{ matrix.component }}.cdx.json
          syft vaultscan/${{ matrix.component }}:sbom -o spdx-json     > sbom-${{ matrix.component }}.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.component }}
          path: |
            sbom-${{ matrix.component }}.cdx.json
            sbom-${{ matrix.component }}.spdx.json
          retention-days: 90

  licenses:
    # License scan via go-licenses for backend modules. Catches:
    #   - GPL/AGPL deps that incompatibly license the binary
    #   - missing license files (compliance liability)
    name: go-licenses scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: install go-licenses
        run: go install github.com/google/go-licenses@latest
      - name: backend
        working-directory: backend
        run: |
          # Allow MIT, Apache-2.0, BSD-2/3-Clause, ISC, MPL-2.0.
          # Disallow GPL-3.0, AGPL-3.0, LGPL-* unless explicitly added
          # to the allow_dynamic list. Output as CSV for traceability.
          go-licenses csv ./... > backend-licenses.csv
          go-licenses check ./... \
            --disallowed_types=forbidden,restricted,unknown
      - name: agent
        working-directory: agent
        run: |
          go-licenses csv ./... > agent-licenses.csv
          go-licenses check ./... \
            --disallowed_types=forbidden,restricted,unknown
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-inventory
          path: |
            backend/backend-licenses.csv
            agent/agent-licenses.csv

  cosign-keyless-sign:
    # Signs each pushed image with cosign keyless (Sigstore Fulcio +
    # Rekor). Only runs on main branch — PRs should not push images.
    # The chart's admission policy (Kyverno) verifies these signatures
    # at deploy time so unsigned images can't enter production.
    name: cosign keyless sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write   # OIDC for keyless signing
      packages: write
    needs: [trivy-backend-images, sbom]
    strategy:
      matrix:
        component: [api, agent-gateway, analytics-worker, portal]
    steps:
      - uses: actions/checkout@v4
      - name: install cosign
        uses: sigstore/cosign-installer@v3
      - name: log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + push
        run: |
          # Same dockerfile dispatch as in sbom job.
          case "${{ matrix.component }}" in
            api)              DF=backend/Dockerfile                          CTX=backend ;;
            agent-gateway)    DF=backend/cmd/agent-gateway/Dockerfile        CTX=backend ;;
            analytics-worker) DF=backend/cmd/analytics-worker/Dockerfile     CTX=backend ;;
            portal)           DF=frontend/Dockerfile                         CTX=frontend ;;
          esac
          IMG=ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ github.sha }}
          docker build -t "$IMG" -f "$DF" "$CTX"
          docker push "$IMG"
          echo "IMG=$IMG" >> "$GITHUB_ENV"
      - name: cosign sign
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes "$IMG"
      - name: cosign verify (sanity)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign verify "$IMG" \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
