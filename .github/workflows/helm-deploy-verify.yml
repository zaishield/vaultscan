name: helm-deploy-verify

# End-to-end deploy verification: spins a real kind cluster, builds
# the API image, helm-installs the chart, asserts /healthz returns
# 200. This is the missing layer above `helm lint` — that catches
# template syntax errors but not "the image won't actually start".

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-verify:
    name: kind + helm + healthz
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.24.0

      - name: deploy verify
        run: ./infra/helm/deploy-verify.sh

      - name: dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl get events -A --sort-by=.lastTimestamp | tail -50
