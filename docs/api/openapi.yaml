openapi: 3.1.0
info:
  title: ZAISHIELD VAULTSCAN API
  version: 1.0.0
  description: |
    Multi-tenant security platform API. Every endpoint requires bearer
    authentication unless explicitly marked `security: []` (public health
    + branding lookup endpoints).

    Rate limits: per-identity defaults to 100 RPS / 60s window;
    per-tenant cap is 10× the identity limit. Limits are exposed via
    `X-RateLimit-Limit` and `X-RateLimit-Reset` on every response.

    Deprecation policy: endpoints scheduled for removal emit
    `Deprecation: true` + `Sunset: <RFC1123 date>` + `Link: <successor>`
    headers at least 90 days before retirement.

    Pagination: list endpoints use `before_id`/`limit` keyset cursors;
    `next_before_id` in the response body advances the page.
  contact:
    name: ZAISHIELD Support
    url: https://docs.vaultscan.zaishield.com/support
  license:
    name: Proprietary
servers:
  - url: "https://api.vaultscan.zaishield.com"
    description: Production
  - url: "http://localhost:8080"
    description: Local dev
