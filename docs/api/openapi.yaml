              schema: {type: string}
            text/plain:
              schema: {type: string}
  /api/v1/audit/verify:
    get:
      summary: Quick audit chain verification (most recent N rows)
      operationId: getAuditVerify
      tags:
        - audit
      responses:
        200: {description: Result, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
  /api/v1/audit/verify-deep:
    get:
      summary: Deep audit chain verification (every row from genesis)
      operationId: getAuditVerifyDeep
      tags:
