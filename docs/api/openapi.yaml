                      type: string
                    cve:
                      type: string
                    scanner:
                      type: string
                    scan_type:
                      type: string
                    affected_endpoint:
                      type: string
                    port:
                      type: integer
                    protocol:
                      type: string
                    status:
                      type: string
                      enum:
                        - open
                        - triaged
