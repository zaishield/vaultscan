run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - nilnil
    - unconvert

issues:
  exclude-rules:
    - path: _test\.go
      linters: [errcheck, gosec, errorlint, bodyclose]
