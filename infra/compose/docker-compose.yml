# VAULTSCAN local development stack.
#
# Quick start (from repo root):
#   make bootstrap     # bring everything up + run migrations + seed
#   make logs          # tail all services
#   make down          # tear everything down
#
# Production maps to: §26.1 control plane (3 nodes), §26.2 PostgreSQL HA,
# §26.3 Ceph storage, §26.4 OpenSearch cluster, §26.5 scanner farm,
# §27 network segmentation. See infra/helm/vaultscan for the production chart.
#
# Every published host port is overridable via env var so the stack can sit
# next to other dev tools that grab the same ports. Either:
#
#   VAULTSCAN_OPENSEARCH_PORT=19200 make bootstrap
#
# or persist overrides in repo-root .env (see .env.example).

name: vaultscan

x-api-env: &api-env
  VAULTSCAN_ENV: development
  VAULTSCAN_DATABASE_URL: postgres://vaultscan:vaultscan@postgres:5432/vaultscan?sslmode=disable
  VAULTSCAN_OPENSEARCH_URL: http://opensearch:9200
  VAULTSCAN_OBJECT_STORE_URL: http://minio:9000
  VAULTSCAN_OBJECT_STORE_KEY: vaultscan
  VAULTSCAN_OBJECT_STORE_SECRET: vaultscan-dev-secret
  VAULTSCAN_KEYCLOAK_ISSUER: http://keycloak:8080/realms/vaultscan
  VAULTSCAN_EVENTBUS_URL: nats://nats:4222
  VAULTSCAN_API_ADDR: ":8080"
  VAULTSCAN_AGENT_GATEWAY_ADDR: ":8443"
  VAULTSCAN_CORS_ALLOWED_ORIGINS: "http://localhost:${VAULTSCAN_PORTAL_PORT:-5173},http://localhost:3000"
  # IMPORTANT: secrets are NOT committed here. Both values must be
  # provided via .env at the repository root (copy .env.example and
  # generate fresh values). compose will refuse to start if either
  # is unset rather than silently fall back to a known-shared dev
  # secret. The previous inline defaults were a Trojan horse — copy-
  # paste of compose.yml into a production setup leaked dev credentials.
  VAULTSCAN_JWT_SECRET: ${VAULTSCAN_JWT_SECRET:?set in .env — generate with: openssl rand -base64 48}
  VAULTSCAN_EVIDENCE_MASTER_KEY: ${VAULTSCAN_EVIDENCE_MASTER_KEY:?set in .env — generate with: openssl rand -base64 32}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaultscan
      POSTGRES_USER: vaultscan
      POSTGRES_PASSWORD: vaultscan
    ports: ["${VAULTSCAN_POSTGRES_PORT:-5432}:5432"]
    volumes:
      - vaultscan-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultscan -d vaultscan"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  opensearch:
    image: opensearchproject/opensearch:2
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Vaultscan-Dev-9!
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports: ["${VAULTSCAN_OPENSEARCH_PORT:-9200}:9200"]
    volumes:
      - vaultscan-os:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vaultscan
      MINIO_ROOT_PASSWORD: vaultscan-dev-secret
    ports:
      - "${VAULTSCAN_MINIO_PORT:-9000}:9000"
      - "${VAULTSCAN_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - vaultscan-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["${VAULTSCAN_KEYCLOAK_PORT:-8081}:8080"]
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    ports:
      - "${VAULTSCAN_NATS_PORT:-4222}:4222"
      - "${VAULTSCAN_NATS_MON_PORT:-8222}:8222"

  # ---- One-shot migration service -----------------------------------------
  # Runs the migrate binary inside the api image. Activated by `make migrate`
  # (or `docker compose run --rm migrate` directly). depends_on:service_healthy
  # ensures Postgres is accepting connections before we try.
  migrate:
    profiles: ["tools"]
    build:
      context: ../..
      dockerfile: infra/compose/api.Dockerfile
    image: vaultscan-api:dev
    environment:
      <<: *api-env
    entrypoint: ["/usr/local/bin/migrate", "-dir", "/backend/migrations"]
    depends_on:
      postgres:
        condition: service_healthy

  # ---- One-shot seed service ---------------------------------------------
  seed:
    profiles: ["tools"]
    build:
      context: ../..
      dockerfile: infra/compose/api.Dockerfile
    image: vaultscan-api:dev
    environment:
      <<: *api-env
    entrypoint: ["/usr/local/bin/seed"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: infra/compose/api.Dockerfile
    image: vaultscan-api:dev
    restart: unless-stopped
    environment:
      <<: *api-env
    ports: ["${VAULTSCAN_API_PORT:-8080}:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  agent-gateway:
    build:
      context: ../..
      dockerfile: infra/compose/agent-gateway.Dockerfile
    image: vaultscan-agent-gateway:dev
    restart: unless-stopped
    environment:
      <<: *api-env
    ports: ["${VAULTSCAN_AGENT_GATEWAY_PORT:-8443}:8443"]
    depends_on:
      postgres:
        condition: service_healthy

  portal:
    build:
      context: ../..
      dockerfile: infra/compose/portal.Dockerfile
    image: vaultscan-portal:dev
    restart: unless-stopped
    ports: ["${VAULTSCAN_PORTAL_PORT:-5173}:80"]
    depends_on: [api]

  # External scanner worker (Blueprint §12). Polls dispatched external scan
  # jobs for its region, verifies the cloud signature + image digest, runs
  # the tool, ingests parsed findings, and reports status. One per region in
  # production; here we run a single AE-region worker for the demo.
  scanner-worker:
    build:
      context: ../..
      dockerfile: infra/compose/scanner-worker.Dockerfile
    image: vaultscan-scanner-worker:dev
    restart: unless-stopped
    environment:
      <<: *api-env
      VAULTSCAN_SCANNER_REGION: ae
      VAULTSCAN_API_PUBLIC_URL: http://api:8080
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  # OpenSearch indexer that mirrors authoritative Postgres records into the
  # analytics index family (Blueprint §26.4). Runs separately from the API so
  # OpenSearch backpressure can't affect the user-facing path.
  analytics-worker:
    build:
      context: ../..
      dockerfile: infra/compose/analytics-worker.Dockerfile
    image: vaultscan-analytics-worker:dev
    restart: unless-stopped
    environment:
      <<: *api-env
      VAULTSCAN_ANALYTICS_INPROC: "false"   # API skips its in-proc indexer
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  # Cron-runner: leader-elected periodic-task runner (SLA sweep, DEK
  # rotation + re-wrap, audit verify-deep, partition maintenance, SIEM
  # shipping, scheduled report generation). Without this, the dev stack
  # silently skips every Blueprint §22.4 scheduled task.
  cron-runner:
    build:
      context: ../..
      dockerfile: infra/compose/cron-runner.Dockerfile
    image: vaultscan-cron-runner:dev
    restart: unless-stopped
    environment:
      <<: *api-env
      VAULTSCAN_CRON_ADMIN_ADDR: ":9091"
    ports: ["${VAULTSCAN_CRON_ADMIN_PORT:-9091}:9091"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  vaultscan-pg: {}
  vaultscan-os: {}
  vaultscan-minio: {}
