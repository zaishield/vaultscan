# Agent gateway terminates outbound-only TLS from internal agents on port 443
# (Blueprint §6.3, §27.3).
apiVersion: v1
kind: Namespace
metadata: { name: vaultscan-agent-gateway }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-gateway
  namespace: vaultscan-agent-gateway
spec:
  replicas: 3
  selector: { matchLabels: { app: vaultscan, component: agent-gateway } }
  template:
    metadata: { labels: { app: vaultscan, component: agent-gateway } }
    spec:
      containers:
        - name: agent-gateway
          image: registry.zaishield.com/vaultscan/agent-gateway:latest
          ports: [{ containerPort: 8443 }]
          envFrom:
            - secretRef: { name: vaultscan-agent-gateway-env }
          resources:
            requests: { cpu: "1", memory: "1Gi" }
            limits:   { cpu: "4", memory: "4Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: agent-gateway
  namespace: vaultscan-agent-gateway
  annotations:
    # Static EIP allocations - production overrides per region.
    service.beta.kubernetes.io/aws-load-balancer-eip-allocations: "eip-aaa,eip-bbb,eip-ccc"
spec:
  type: LoadBalancer
  selector: { app: vaultscan, component: agent-gateway }
  ports: [{ port: 443, targetPort: 8443 }]
