# Scanner farm: one isolated namespace per region, network-policy-locked
# (Blueprint §12, §27.2).
apiVersion: v1
kind: Namespace
metadata:
  name: vaultscan-scanner-ae
  labels: { vaultscan-region: ae, vaultscan-tier: scanner }
---
# Default-deny: scanner pods only reach the upload sidecar + DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scanner-default-deny
  namespace: vaultscan-scanner-ae
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { vaultscan-tier: control } }
          podSelector: { matchLabels: { component: object-store } }
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: scanner-quota
  namespace: vaultscan-scanner-ae
spec:
  hard:
    requests.cpu: "64"
    requests.memory: "256Gi"
    limits.cpu: "128"
    limits.memory: "512Gi"
    pods: "200"
