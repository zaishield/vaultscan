# VAULTSCAN Helm values. Production deployments should override the
# `databases.external` block and reference an externally-managed Secret.

global:
  imageRegistry: registry.zaishield.com
  imageRepositoryPrefix: vaultscan
  imageTag: ""              # empty -> falls back to .Chart.AppVersion
  imagePullSecrets: []
  env: production           # set to "development" to enable the dev-token endpoint
  brandingDefaultPartnerSlug: zaishield-direct
  podAnnotations: {}
  podLabels: {}

# ----- API control plane (Blueprint §11) ------------------------------------
api:
  replicaCount: 3
  image:
    repository: api
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests: { cpu: "1",   memory: "1Gi" }
    limits:   { cpu: "4",   memory: "8Gi" }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: api.vaultscan.zaishield.com
        paths: ["/"]
    tls:
      - secretName: vaultscan-api-tls
        hosts: [api.vaultscan.zaishield.com]
  rateLimitRPS: 100
  emergencyStopMaxLatencySeconds: 30

# ----- Agent gateway (Blueprint §6.3, §27.3) -------------------------------
agentGateway:
  replicaCount: 3
  image:
    repository: agent-gateway
    tag: ""
  service:
    type: LoadBalancer
    port: 443
    targetPort: 8443
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-eip-allocations: ""
  resources:
    requests: { cpu: "1", memory: "1Gi" }
    limits:   { cpu: "4", memory: "4Gi" }
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

# ----- Portal (Blueprint §7) ------------------------------------------------
portal:
  replicaCount: 2
  image:
    repository: portal
    tag: ""
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: vaultscan.zaishield.com
        paths: ["/"]
    tls:
      - secretName: vaultscan-portal-tls
        hosts: [vaultscan.zaishield.com]
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "256Mi" }

# ----- Analytics worker (Blueprint §26.4) -----------------------------------
analyticsWorker:
  replicaCount: 2
  image:
    repository: analytics-worker
    tag: ""
  resources:
    requests: { cpu: "200m", memory: "256Mi" }
    limits:   { cpu: "2",    memory: "2Gi" }

# ----- Migrations (one-shot Job, runs pre-install / pre-upgrade) ------------
migrations:
  enabled: true
  image:
    repository: api      # the api image ships the migrate binary
    tag: ""
  command: ["/usr/local/bin/migrate", "-dir", "/backend/migrations"]
  backoffLimit: 3
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ----- Database / search / object store endpoints --------------------------
# Production: leave bundled.* false and provide external endpoints.
databases:
  bundled:
    postgres: false
    opensearch: false
    minio: false
  external:
    postgresURL: ""      # postgres://user:pass@pg.example.com:5432/vaultscan?sslmode=require
    opensearchURL: ""
    objectStoreURL: ""
    objectStoreBucket: vaultscan-evidence
    keycloakIssuer: ""
    eventBusURL: nats://nats.vaultscan-control:4222

# ----- Secrets --------------------------------------------------------------
# Provide an existing Secret with the keys listed in README.md.
secrets:
  existingSecret: vaultscan-api-env
  inline:               # only used if existingSecret is empty (NOT recommended)
    databaseURL: ""
    jwtSecret: ""
    evidenceMasterKey: ""
    jobSigningKey: ""
    objectStoreKey: ""
    objectStoreSecret: ""

# ----- Network policies (Blueprint §27.1) -----------------------------------
networkPolicies:
  enabled: true

# ----- Prometheus ServiceMonitor (optional) ---------------------------------
serviceMonitor:
  enabled: false
  interval: 30s

# ----- Default scheduler hints ----------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}

# ----- Backup CronJob (HS-03) -----------------------------------------------
# Nightly pg_dump + S3 upload. See docs/operations/disaster-recovery.md
# for the restore drill.
backup:
  enabled: false
  schedule: "0 2 * * *"      # 02:00 cluster TZ
  image: ghcr.io/zaishield/vaultscan-backup:0.1.0
  pgHost: postgres.vaultscan-data
  pgUser: vaultscan
  pgSecretName: vaultscan-postgres-credentials
  s3Bucket: vaultscan-backups
  s3Endpoint: https://s3.amazonaws.com
  s3SecretName: vaultscan-backup-s3-credentials
  retention:
    daily: 14
    weekly: 8
    monthly: 24

# ----- Restore-verify CronJob (HS-03 follow-up) -----------------------------
# Nightly drill that pulls the latest backup, restores into a sandbox
# Postgres, runs the audit-chain verifier, exits non-zero on failure.
# kube_job_failed alert pages on-call. Without this job, backups rot
# silently — restore-once-a-quarter is too slow to catch corruption.
restoreVerify:
  enabled: false
  schedule: "0 4 * * *"      # 04:00 cluster TZ (2h after backup)
  image: ghcr.io/zaishield/vaultscan-restore-verify:0.1.0

# ----- Pod Security profile (HS-03) -----------------------------------------
# Defaults applied via the shared _security.tpl helpers. Overriding any
# field here lets an operator relax the posture intentionally.
security:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop: [ALL]
