{{- if .Values.portal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vaultscan.fullname" . }}-portal
  labels: {{- include "vaultscan.componentLabels" (dict "component" "portal" "Chart" .Chart "Release" .Release) | nindent 4 }}
spec:
  # NOTE: was `replicaCount` here — that's not a valid Deployment.spec
  # field (it's the Helm values key, not the k8s field). Existing
  # deploys silently defaulted to 1 replica regardless of the values
  # file. Fixed 2026-05 as part of the audit pass.
  replicas: {{ .Values.portal.replicaCount }}
  selector:
    matchLabels: {{- include "vaultscan.componentSelector" (dict "root" . "component" "portal") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "vaultscan.componentSelector" (dict "root" . "component" "portal") | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      # nginx-unprivileged runs as uid 101 by default. We use the
      # image's own user rather than the global 65532 because nginx
      # needs to read its bundled config + write to /var/cache/nginx
      # via writable emptyDir mounts below.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: portal
          image: {{ include "vaultscan.image" (dict "root" . "repository" .Values.portal.image.repository "tag" .Values.portal.image.tag) }}
          imagePullPolicy: {{ .Values.portal.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # nginx-unprivileged binds 8080 — only port a non-root user
          # can claim by default. Service maps :80 → :8080 below.
          ports: [{ name: http, containerPort: {{ .Values.portal.containerPort | default 8080 }} }]
          resources: {{- toYaml .Values.portal.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            failureThreshold: 3
          lifecycle: {}
          # Writable mounts for nginx — cache, run pid, temp config
          # spool. Without these, readOnlyRootFilesystem causes nginx
          # to fail on first request (cannot open temp file).
          volumeMounts:
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run,   mountPath: /var/run }
            - { name: tmp,         mountPath: /tmp }
      volumes:
        - { name: nginx-cache, emptyDir: { sizeLimit: 64Mi } }
        - { name: nginx-run,   emptyDir: { sizeLimit: 4Mi } }
        - { name: tmp,         emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vaultscan.fullname" . }}-portal
  labels: {{- include "vaultscan.componentLabels" (dict "component" "portal" "Chart" .Chart "Release" .Release) | nindent 4 }}
spec:
  type: {{ .Values.portal.service.type }}
  selector: {{- include "vaultscan.componentSelector" (dict "root" . "component" "portal") | nindent 4 }}
  ports:
    - port: {{ .Values.portal.service.port }}
      targetPort: http
      name: http
{{- if .Values.portal.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vaultscan.fullname" . }}-portal
  annotations: {{- toYaml .Values.portal.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.portal.ingress.className }}
  rules:
  {{- range .Values.portal.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
        {{- range .paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "vaultscan.fullname" $ }}-portal
                port: { number: {{ $.Values.portal.service.port }} }
        {{- end }}
  {{- end }}
  tls: {{- toYaml .Values.portal.ingress.tls | nindent 4 }}
{{- end }}
{{- end }}
