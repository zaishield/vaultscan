apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vaultscan.fullname" . }}-agent-gateway
  labels: {{- include "vaultscan.componentLabels" (dict "component" "agent-gateway" "Chart" .Chart "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.agentGateway.replicaCount }}
  selector:
    matchLabels: {{- include "vaultscan.componentSelector" (dict "root" . "component" "agent-gateway") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "vaultscan.componentSelector" (dict "root" . "component" "agent-gateway") | nindent 8 }}
    spec:
      # Agent gateway hosts long-lived mTLS connections from
      # on-prem agents. 60s grace lets in-flight uploads/heartbeats
      # complete before SIGKILL — agents otherwise retry the same
      # upload against another pod.
      terminationGracePeriodSeconds: 60
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent-gateway
          image: {{ include "vaultscan.image" (dict "root" . "repository" .Values.agentGateway.image.repository "tag" .Values.agentGateway.image.tag) }}
          imagePullPolicy: {{ .Values.agentGateway.image.pullPolicy | default "IfNotPresent" }}
          ports: [{ name: tls, containerPort: 8443 }]
          envFrom: {{- include "vaultscan.envFrom" (dict "root" .) | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: tls }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: tls }
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              # 15s drain — readinessProbe will go red and the
              # service stops routing new connections before SIGTERM.
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          resources: {{- toYaml .Values.agentGateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vaultscan.fullname" . }}-agent-gateway
  labels: {{- include "vaultscan.componentLabels" (dict "component" "agent-gateway" "Chart" .Chart "Release" .Release) | nindent 4 }}
  {{- with .Values.agentGateway.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.agentGateway.service.type }}
  selector: {{- include "vaultscan.componentSelector" (dict "root" . "component" "agent-gateway") | nindent 4 }}
  ports:
    - port: {{ .Values.agentGateway.service.port }}
      targetPort: {{ .Values.agentGateway.service.targetPort }}
      name: tls
{{- if .Values.agentGateway.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "vaultscan.fullname" . }}-agent-gateway
spec:
  minAvailable: {{ .Values.agentGateway.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "vaultscan.componentSelector" (dict "root" . "component" "agent-gateway") | nindent 6 }}
{{- end }}
