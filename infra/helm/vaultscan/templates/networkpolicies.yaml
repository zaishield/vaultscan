{{- if .Values.networkPolicies.enabled }}
# Default-deny baseline plus per-component allow rules derived from
# Blueprint §27.1 segmentation.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vaultscan.fullname" . }}-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vaultscan.fullname" . }}-api-allow-portal
spec:
  podSelector:
    matchLabels: {{- include "vaultscan.componentSelector" (dict "root" . "component" "api") | nindent 6 }}
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "vaultscan.componentSelector" (dict "root" . "component" "portal") | nindent 14 }}
        - namespaceSelector:
            matchLabels: { vaultscan-tier: ingress }
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vaultscan.fullname" . }}-agent-gateway-allow-public
spec:
  podSelector:
    matchLabels: {{- include "vaultscan.componentSelector" (dict "root" . "component" "agent-gateway") | nindent 6 }}
  ingress:
    - from: []                                  # external (LoadBalancer) - tighten with WAF
      ports:
        - { protocol: TCP, port: 8443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vaultscan.fullname" . }}-portal-allow-ingress
spec:
  podSelector:
    matchLabels: {{- include "vaultscan.componentSelector" (dict "root" . "component" "portal") | nindent 6 }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { vaultscan-tier: ingress }
      ports:
        - { protocol: TCP, port: 80 }
{{- end }}
