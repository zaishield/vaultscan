apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vaultscan.fullname" . }}-api
  labels: {{- include "vaultscan.componentLabels" (dict "component" "api" "Chart" .Chart "Release" .Release) | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "vaultscan.componentSelector" (dict "root" . "component" "api") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1, maxSurge: 1 }
  template:
    metadata:
      labels: {{- include "vaultscan.componentSelector" (dict "root" . "component" "api") | nindent 8 }}
      {{- with .Values.global.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      # Give in-flight requests ~30s to drain on rolling deploy.
      # Combined with the preStop sleep + readinessProbe periodSeconds=5,
      # this gives the load balancer time to mark the pod NotReady
      # before kubelet sends SIGTERM, so no request lands on a
      # half-shut-down api process.
      terminationGracePeriodSeconds: 45
      # The API never calls the K8s API — disable token mount.
      automountServiceAccountToken: false
      securityContext:
        {{- include "vaultscan.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "vaultscan.image" (dict "root" . "repository" .Values.api.image.repository "tag" .Values.api.image.tag) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- include "vaultscan.containerSecurityContext" . | nindent 12 }}
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: {{- include "vaultscan.envFrom" (dict "root" .) | nindent 12 }}
          readinessProbe:
            # /readyz isn't ready until DB + audit-chain checks pass.
            # initialDelaySeconds=2 avoids the first probe arriving
            # before the listener binds.
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            failureThreshold: 3
          # preStop: stop receiving new traffic and let in-flight
          # requests drain. /readyz starts failing immediately so
          # the LB removes us from rotation; the sleep gives kube-
          # proxy + ingress time to propagate the change.
          # Distroless has no /bin/sh — use the API binary's
          # built-in graceful shutdown which the SIGTERM handler
          # picks up. The sleep is approximated by
          # terminationGracePeriodSeconds + readinessProbe failure.
          lifecycle: {}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vaultscan.fullname" . }}-api
  labels: {{- include "vaultscan.componentLabels" (dict "component" "api" "Chart" .Chart "Release" .Release) | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector: {{- include "vaultscan.componentSelector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      name: http
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "vaultscan.fullname" . }}-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "vaultscan.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.api.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "vaultscan.fullname" . }}-api
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "vaultscan.componentSelector" (dict "root" . "component" "api") | nindent 6 }}
{{- end }}
{{- if .Values.api.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vaultscan.fullname" . }}-api
  annotations: {{- toYaml .Values.api.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.api.ingress.className }}
  rules:
  {{- range .Values.api.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
        {{- range .paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "vaultscan.fullname" $ }}-api
                port: { number: {{ $.Values.api.service.port }} }
        {{- end }}
  {{- end }}
  tls: {{- toYaml .Values.api.ingress.tls | nindent 4 }}
{{- end }}
