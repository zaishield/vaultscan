apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vaultscan.fullname" . }}-analytics-worker
  labels: {{- include "vaultscan.componentLabels" (dict "component" "analytics-worker" "Chart" .Chart "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.analyticsWorker.replicaCount }}
  selector:
    matchLabels: {{- include "vaultscan.componentSelector" (dict "root" . "component" "analytics-worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "vaultscan.componentSelector" (dict "root" . "component" "analytics-worker") | nindent 8 }}
    spec:
      # Analytics worker batches event-bus events into the warehouse;
      # 45s grace lets the in-flight batch flush before SIGKILL.
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        {{- include "vaultscan.podSecurityContext" . | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: analytics-worker
          image: {{ include "vaultscan.image" (dict "root" . "repository" .Values.analyticsWorker.image.repository "tag" .Values.analyticsWorker.image.tag) }}
          imagePullPolicy: {{ .Values.analyticsWorker.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- include "vaultscan.containerSecurityContext" . | nindent 12 }}
          envFrom: {{- include "vaultscan.envFrom" (dict "root" .) | nindent 12 }}
          env:
            - { name: VAULTSCAN_ANALYTICS_INPROC, value: "false" }
          resources: {{- toYaml .Values.analyticsWorker.resources | nindent 12 }}
          # The worker exposes /healthz on :9090 for liveness and
          # /readyz for readiness (latter checks DB + NATS reachability).
          # Without these the kubelet has no signal that a stalled
          # in-process loop has gone permanently bad.
          livenessProbe:
            httpGet: { path: /healthz, port: 9090 }
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          ports:
            - { name: health, containerPort: 9090, protocol: TCP }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
