{{- if .Values.cronRunner.enabled }}
{{/*
Cron-runner (Blueprint §22.4).

Leader-elected background worker that drives every periodic task in
the platform. Multiple replicas are SAFE — every job takes a Postgres
advisory lock keyed on the job name, so only the lock-holder executes
the work and follower replicas exit early. Two replicas is the sweet
spot: HA-during-rolling-restart without doubling the DB load.

What it runs (see backend/cmd/cron-runner/main.go for the full list):
  - findings.SweepSLABreaches            hourly
  - evidence.SweepExpired                hourly
  - evidence.RotateStaleTenantKeys       24h
  - evidence.ReWrapTenantObjects         hourly (bounded batch)
  - audit.VerifyDeep                     hourly
  - audit.ShipBatch (SIEM forwarder)     30s
  - scanorch.NodeOps.FailoverStalled     30s
  - reporting.RunDue                     5m
  - agent telemetry rollup               hourly
  - vaultscan_ensure_month_partition     6h
  - compliance.Evaluator.EvaluateAll     6h
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vaultscan.fullname" . }}-cron-runner
  labels: {{- include "vaultscan.componentLabels" (dict "component" "cron-runner" "Chart" .Chart "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.cronRunner.replicaCount }}
  selector:
    matchLabels: {{- include "vaultscan.componentSelector" (dict "root" . "component" "cron-runner") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: {{- include "vaultscan.componentSelector" (dict "root" . "component" "cron-runner") | nindent 8 }}
      {{- with .Values.global.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # No K8s API calls from cron-runner — disable token mount.
      automountServiceAccountToken: false
      # 60s grace lets the active leader finish its current tick
      # (including the bounded DEK re-wrap batch) before SIGKILL.
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- include "vaultscan.podSecurityContext" . | nindent 8 }}
      {{- include "vaultscan.podTopologyConstraints" (dict "app.kubernetes.io/name" .Chart.Name "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/component" "cron-runner") | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cron-runner
          image: {{ include "vaultscan.image" (dict "root" . "repository" .Values.cronRunner.image.repository "tag" .Values.cronRunner.image.tag) }}
          imagePullPolicy: {{ .Values.cronRunner.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- include "vaultscan.containerSecurityContext" . | nindent 12 }}
          ports:
            - { name: admin, containerPort: 9091 }
          envFrom: {{- include "vaultscan.envFrom" (dict "root" .) | nindent 12 }}
          env:
            - { name: VAULTSCAN_CRON_ADMIN_ADDR, value: ":9091" }
            {{- with .Values.global.region }}
            - { name: VAULTSCAN_REGION, value: {{ . | quote }} }
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: admin }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            periodSeconds: 30
            failureThreshold: 3
          resources: {{- toYaml .Values.cronRunner.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.cronRunner.auditArchive.enabled }}
            - { name: audit-archive, mountPath: {{ .Values.cronRunner.auditArchive.mountPath | default "/var/lib/vaultscan/audit-archive" | quote }} }
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
        {{- if .Values.cronRunner.auditArchive.enabled }}
        # audit-archive volume. The audit_archive_sweep cron job
        # writes nightly DER bundles + TSA tokens here before
        # uploading to long-term storage. Without this mount the
        # writes EROFS-fail against the read-only root FS and the
        # archiver tick is silently a no-op.
        # storage:
        #   - persistentVolumeClaim (default below) — backed by the
        #     cluster default StorageClass; survives pod restarts so
        #     a sweep interrupted by a deploy can resume.
        #   - operator can override with an explicit volume by
        #     setting cronRunner.auditArchive.volumeSource.
        - name: audit-archive
          {{- with .Values.cronRunner.auditArchive.volumeSource }}
          {{- toYaml . | nindent 10 }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.cronRunner.auditArchive.existingClaim | default (printf "%s-audit-archive" (include "vaultscan.fullname" .)) | quote }}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vaultscan.fullname" . }}-cron-runner
  labels: {{- include "vaultscan.componentLabels" (dict "component" "cron-runner" "Chart" .Chart "Release" .Release) | nindent 4 }}
spec:
  type: ClusterIP
  # Metrics-only service — exposed for the Prometheus ServiceMonitor.
  selector: {{- include "vaultscan.componentSelector" (dict "root" . "component" "cron-runner") | nindent 4 }}
  ports:
    - { name: admin, port: 9091, targetPort: admin }
{{- if and .Values.cronRunner.auditArchive.enabled (not .Values.cronRunner.auditArchive.existingClaim) (not .Values.cronRunner.auditArchive.volumeSource) }}
---
# PVC for the cron-runner audit-archive volume. Auto-created when
# cronRunner.auditArchive.enabled=true AND neither existingClaim
# nor volumeSource is set. Operators with an existing claim or a
# different volume backend (NFS, hostPath for single-node dev)
# override via those values.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vaultscan.fullname" . }}-audit-archive
  labels: {{- include "vaultscan.componentLabels" (dict "component" "cron-runner" "Chart" .Chart "Release" .Release) | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.cronRunner.auditArchive.size | default "20Gi" | quote }}
  {{- with .Values.cronRunner.auditArchive.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if .Values.cronRunner.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "vaultscan.fullname" . }}-cron-runner
spec:
  # Leader-elected pattern means we always need at least one pod up
  # so the next leader election can complete promptly.
  minAvailable: {{ .Values.cronRunner.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "vaultscan.componentSelector" (dict "root" . "component" "cron-runner") | nindent 6 }}
{{- end }}
{{- end }}
