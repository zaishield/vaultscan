{{- if .Values.migrations.enabled }}
# Pre-install / pre-upgrade Job runs the schema migrator before Pods start.
# The job is idempotent and safe to re-run.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vaultscan.fullname" . }}-migrations
  annotations:
    "helm.sh/hook":              pre-install,pre-upgrade
    "helm.sh/hook-weight":       "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels: {{- include "vaultscan.componentLabels" (dict "component" "migrations" "Chart" .Chart "Release" .Release) | nindent 4 }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels: {{- include "vaultscan.componentSelector" (dict "root" . "component" "migrations") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "vaultscan.image" (dict "root" . "repository" .Values.migrations.image.repository "tag" .Values.migrations.image.tag) }}
          command: {{- toYaml .Values.migrations.command | nindent 12 }}
          envFrom: {{- include "vaultscan.envFrom" (dict "root" .) | nindent 12 }}
          resources: {{- toYaml .Values.migrations.resources | nindent 12 }}
{{- end }}
