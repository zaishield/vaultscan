{{/*
Secret resource.

Two valid configurations:
  1. PRODUCTION (recommended): operator pre-creates a Secret
     externally (SealedSecrets / External Secrets Operator / Vault
     CSI / etc.) and points secrets.existingSecret at its name.
     This template renders nothing — the envFrom in every Deployment
     references the externally-managed Secret directly.
  2. DEV / KIND (acceptable for non-production): operator inlines
     values under secrets.inline.* and leaves secrets.existingSecret
     empty. This template renders a Secret with stringData fields.
     Values land in Kubernetes etcd and in Helm release state —
     unsuitable for prod.

INVALID: both empty. The chart explicitly fails to render rather
than producing a deployment that mounts a non-existent Secret and
silently boots with empty env vars.
*/}}
{{- if and (not .Values.secrets.existingSecret) (not .Values.secrets.inline.databaseURL) }}
{{- fail (printf "\n\n!! VaultScan chart misconfigured !!\n\nEither secrets.existingSecret must reference a pre-created Secret\n(production / SealedSecrets / Vault path), OR secrets.inline.databaseURL\nmust be set (dev / kind path).\n\nCurrent values:\n  secrets.existingSecret = %q\n  secrets.inline.databaseURL = %q\n\nSee infra/helm/vaultscan/README.md for the contract.\n" .Values.secrets.existingSecret .Values.secrets.inline.databaseURL) }}
{{- end }}
{{- if and (not .Values.secrets.existingSecret) .Values.secrets.inline.databaseURL }}
# WARNING: rendered from values.yaml. Production must use an
# externally-managed Secret (SealedSecrets, External Secrets, Vault).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vaultscan.fullname" . }}
  labels: {{- include "vaultscan.labels" . | nindent 4 }}
type: Opaque
stringData:
  VAULTSCAN_DATABASE_URL:        {{ .Values.secrets.inline.databaseURL | quote }}
  VAULTSCAN_JWT_SECRET:          {{ .Values.secrets.inline.jwtSecret | quote }}
  VAULTSCAN_EVIDENCE_MASTER_KEY: {{ .Values.secrets.inline.evidenceMasterKey | quote }}
  VAULTSCAN_JOB_SIGNING_KEY:     {{ .Values.secrets.inline.jobSigningKey | quote }}
  VAULTSCAN_OBJECT_STORE_KEY:    {{ .Values.secrets.inline.objectStoreKey | quote }}
  VAULTSCAN_OBJECT_STORE_SECRET: {{ .Values.secrets.inline.objectStoreSecret | quote }}
{{- end }}
